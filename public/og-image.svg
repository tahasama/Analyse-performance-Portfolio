<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161c"/>
      <stop offset="1" stop-color="#191b22"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#2a2d38" stroke-width="2"/>

  <text x="80" y="120" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="18"
        letter-spacing="4" fill="#d99a3e">PORTFOLIO — DOCUMENT CONTROL</text>

  <text x="78" y="230" font-family="'Source Serif 4', Georgia, serif" font-weight="700" font-size="72"
        fill="#f4f5f7">Maatof Taha</text>

  <text x="80" y="300" font-family="'Source Serif 4', Georgia, serif" font-style="italic" font-size="34"
        fill="#8f9bb3">Performance Systems for Document Control</text>

  <text x="80" y="360" font-family="Inter, sans-serif" font-size="20" fill="#8f9bb3">
    <tspan x="80" dy="0">Six performance-reporting systems, the DCIOM governance</tspan>
    <tspan x="80" dy="30">architecture behind them, and independent research.</tspan>
  </text>

  <!-- six-node system line motif, echoing the site's own C1-C6 navigation -->
  <g transform="translate(80,470)">
    <line x1="14" y1="14" x2="1026" y2="14" stroke="#2a2d38" stroke-width="1.5"/>
    <g font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="600" fill="#d99a3e">
      <circle cx="14" cy="14" r="14" fill="#14161c" stroke="#d99a3e" stroke-width="1.5"/>
      <text x="14" y="19" text-anchor="middle">1</text>
      <circle cx="216" cy="14" r="14" fill="#14161c" stroke="#d99a3e" stroke-width="1.5"/>
      <text x="216" y="19" text-anchor="middle">2</text>
      <circle cx="418" cy="14" r="14" fill="#14161c" stroke="#d99a3e" stroke-width="1.5"/>
      <text x="418" y="19" text-anchor="middle">3</text>
      <circle cx="620" cy="14" r="14" fill="#14161c" stroke="#d99a3e" stroke-width="1.5"/>
      <text x="620" y="19" text-anchor="middle">4</text>
      <circle cx="822" cy="14" r="14" fill="#14161c" stroke="#d99a3e" stroke-width="1.5"/>
      <text x="822" y="19" text-anchor="middle">5</text>
      <circle cx="1024" cy="14" r="14" fill="#14161c" stroke="#d99a3e" stroke-width="1.5"/>
      <text x="1024" y="19" text-anchor="middle">6</text>
    </g>
  </g>
</svg>
